<style>@font-face{font-family:Poppins;font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:Poppins;font-style:normal;font-weight:700;src:url(data:font/woff;base64,) format('woff')}
