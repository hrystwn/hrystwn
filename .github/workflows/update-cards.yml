name: Update contribution cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# The cron and a push can land together; both would rewrite the same files and
# one would fail its push. Serialize instead of cancelling a half-finished commit.
concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: python3 scripts/render_readme_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Refresh contribution cards [skip ci]"
          file_pattern: "data/contributions.json data/site.json cards/*.svg"
