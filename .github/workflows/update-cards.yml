name: Update contribution cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/fetch-contributions.mjs
      - run: python3 scripts/render_readme_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Refresh contribution cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
