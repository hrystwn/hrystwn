name: Update contribution heatmap

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-contributions.mjs
      - run: node scripts/render-heatmap.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
